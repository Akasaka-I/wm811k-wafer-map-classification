experiment:
  name: custom_cnn_64
  seed: 42
  output_dir: outputs/experiments
  checkpoint_dir: outputs/checkpoints

data:
  processed_dir: data/processed
  batch_size: 256
  num_workers: 0

model:
  name: custom_cnn
  input_channels: 2
  num_classes: 9
  dropout: 0.25

training:
  device: auto
  epochs: 40
  mixed_precision: true
  early_stopping_patience: 8

loss:
  name: weighted_cross_entropy

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0001

scheduler:
  name: cosine
