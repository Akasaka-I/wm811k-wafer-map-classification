experiment:
  name: swin_tiny_64_stable
  seed: 42
  output_dir: outputs/experiments
  checkpoint_dir: outputs/checkpoints

data:
  processed_dir: data/processed
  batch_size: 96
  num_workers: 0

model:
  name: swin_tiny
  input_channels: 2
  num_classes: 9
  pretrained: false

training:
  device: auto
  epochs: 60
  mixed_precision: true
  amp_dtype: bfloat16
  gradient_clip_norm: 1.0
  early_stopping_patience: 12
  early_stopping_min_epochs: 15

loss:
  name: weighted_cross_entropy
  class_weight_power: 0.5
  max_class_weight: 10.0

optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001

scheduler:
  name: warmup_cosine
  warmup_epochs: 5
  start_factor: 0.1
  eta_min: 0.000001
