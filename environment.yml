name: py39
channels:
  - defaults
dependencies:
  - python=3.9
  - pip
  - pip:
      - matplotlib==3.6.3
      - numpy==1.23.5
      - pandas==1.5.3
      - PyYAML==6.0
      - scikit-learn==1.2.1
      - torch==2.7.1
      - torchvision==0.22.1
      - psycopg[binary]>=3.1,<4

